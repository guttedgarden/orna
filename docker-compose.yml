services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped

    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-orna_memory}

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-orna} -d $${POSTGRES_DB:-orna_memory}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    networks:
      - memory-internal

networks:
  memory-internal:
    driver: bridge